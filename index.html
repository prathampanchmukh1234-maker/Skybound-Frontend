
<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="SykBound: The premium all-in-one platform for travel, entertainment, and lifestyle. Redefining how you explore and enjoy the world.">
    <meta name="theme-color" content="#6366f1">
    <meta property="og:title" content="SykBound - Premium Entertainment & Travel">
    <meta property="og:description" content="The premium all-in-one platform for travel, entertainment, and lifestyle.">
    <title>SykBound - Premium Entertainment & Travel</title>
    <link rel="icon" type="image/svg+xml" href="/logo.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              indigo: { 50: '#eef2ff', 100: '#e0e7ff', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca' }
            }
          }
        }
      }
    </script>
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --secondary: #ec4899;
            --accent: #8b5cf6;
            --bg-base: #ffffff;
            --bg-soft: #f8fafc;
            --text-base: #0f172a;
            --text-muted: #64748b;
            --border-soft: rgba(226, 232, 240, 0.8);
            --radius-xl: 1.5rem;
            --radius-2xl: 2rem;
            --radius-3xl: 3rem;
        }
        .dark {
            --bg-base: #030712;
            --bg-soft: #0f172a;
            --text-base: #f8fafc;
            --text-muted: #94a3b8;
            --border-soft: rgba(255, 255, 255, 0.05);
        }
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: var(--bg-base);
            color: var(--text-base);
            transition: background-color 0.5s cubic-bezier(0.4, 0, 0.2, 1), color 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* Premium Glass Effects */
        .glass { 
            backdrop-filter: blur(20px) saturate(180%); 
            background: rgba(255, 255, 255, 0.7); 
            border: 1px solid var(--border-soft); 
        }
        .dark .glass { 
            background: rgba(15, 23, 42, 0.6); 
            border: 1px solid var(--border-soft); 
        }

        .crystal-card {
            background: var(--bg-base);
            border: 1px solid var(--border-soft);
            border-radius: var(--radius-2xl);
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
        }
        .crystal-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.1);
            border-color: var(--primary);
        }

        .azure-btn { 
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%); 
            color: white; 
            box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.4); 
            transition: all 0.3s ease;
        }
        .azure-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px -5px rgba(99, 102, 241, 0.5);
        }

        /* Mesh Gradients */
        .mesh-gradient {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: -1;
        }
        .blob {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, transparent 70%);
            filter: blur(80px);
            border-radius: 50%;
            animation: move 20s infinite alternate;
        }
        @keyframes move {
            from { transform: translate(-10%, -10%); }
            to { transform: translate(10%, 10%); }
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .dark ::-webkit-scrollbar-thumb { background: #334155; }

        /* Marquee Animation */
        @keyframes marquee {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }
        .animate-marquee {
            display: flex;
            width: max-content;
            animation: marquee 40s linear infinite;
        }

        /* Print Styles */
        @media print {
            body * { visibility: hidden; }
            #ticket-print-area, #ticket-print-area * { visibility: visible; }
            #ticket-print-area { position: absolute; left: 0; top: 0; width: 100%; }
            .no-print { display: none !important; }
        }

        .gradient-bg {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "@google/genai": "https://esm.sh/@google/genai@^1.41.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react-router-dom": "https://esm.sh/react-router-dom@^7.13.0",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@^2.45.0",
    "chart.js": "https://esm.sh/chart.js@^4.4.1",
    "react-chartjs-2": "https://esm.sh/react-chartjs-2@^5.2.0"
  }
}
</script>

</head>

    <div id="root"></div>
<script type="module" src="/src/index.tsx"></script>
</body>
</html>
